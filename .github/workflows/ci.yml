name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demeter-browser-evidence
          path: |
            artifacts/
            playwright-report/
            test-results/
            file_*.png
          if-no-files-found: ignore
